<svg viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two projects by Yeshwanth S">
  <style>
    :root { --ink:#000000; --paper:#FFFFFF; }
    @media (prefers-color-scheme:dark) { :root { --ink:#FFFFFF; --paper:#000000; } }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.15s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
    :root { --ink:#000000; --paper:#FFFFFF; }
  </style>

  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24">01 / VIGILENS</text>
      <text class="copy" x="48" y="49">Real-time video intelligence for live RTSP streams with fast screening and Gemini verification.</text>
      <text class="copy" x="48" y="68">Stores event memory and timelines in SQLite to support natural-language history queries.</text>
      <text class="meta" x="48" y="87">PYTHON · FASTAPI · GEMINI API · SQLITE · STREAMING DETECTION · EVENT MEMORY</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r2" transform="translate(0 140)">
      <text class="title" x="48" y="24">02 / TERMINUS</text>
      <text class="copy" x="48" y="49">Intelligent CLI-first automation tool enabling natural language control over files and dev workflows.</text>
      <text class="copy" x="48" y="68">Integrates Gmail &amp; Google Calendar APIs for schedules and incorporates stateful session memory.</text>
      <text class="meta" x="48" y="87">PYTHON · CLI AUTOMATION · LLM INTEGRATION · GMAIL API · PRODUCTIVITY</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
  </g>
</svg>
