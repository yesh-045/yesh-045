  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    :root { --bone: #FFFFFF; --muted: #888888; --rule: #262626; }
  </style>

  <text class="mono" x="0" y="16" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing="2">01 // STACK</text>
  
  <line x1="120" y1="32" x2="120" y2="178" stroke="var(--rule)" stroke-width="1"/>

