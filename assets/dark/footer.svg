<svg viewBox="0 0 1000 95" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: building. Tamil Nadu, India. github.com/yesh-045">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 56px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .draw,.dot,.ring{animation:none} .draw{stroke-dashoffset:0} .ring{opacity:0} }
    :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
  </style>
  <line class="draw" x1="48" y1="24" x2="952" y2="24"/>
  <circle class="ring" cx="60" cy="56" r="5" stroke="var(--accent)" stroke-width="1" fill="none"/>
  <circle class="dot" cx="60" cy="56" r="4" fill="var(--accent)"/>
  <text class="mono" x="82" y="60" font-size="12" letter-spacing="3" fill="var(--bone)">STATUS &#8212; BUILDING</text>
  <text class="mono" x="952" y="60" font-size="14" text-anchor="end" fill="var(--muted)">github.com/yesh-045&#160;&#160;&#183;&#160;&#160;Tamil Nadu, IN&#160;&#160;&#183;&#160;&#160;&#169; 2026</text>
</svg>
